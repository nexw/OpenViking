name: Android Native Prebuild

# Cross-compiles OpenViking's native artifacts for Termux (Android/bionic,
# aarch64) with the Android NDK, so a phone never needs a Rust/C++ toolchain:
#
#   openviking/bin/ov                                  Rust CLI
#   openviking/lib/ragfs_python.abi3.so                PyO3 RAGFS binding
#   openviking/storage/vectordb/engine/_native.abi3.so C++ vectordb engine
#
# Why an NDK cross build and not the regular `_build.yml` wheel jobs: the two
# extensions use the stable API (Py_LIMITED_API >= 3.10), but must link bionic
# and the selected Termux libpython. They require that CPython minor version on
# the device, so the wheel tags must name that exact minor, not abi3.
# A manylinux/glibc extension cannot load here.
#
# Outputs (API tag follows android_api_level; default 24):
#   openviking-<ver>-cp314-cp314-android_24_arm64_v8a.whl   full package wheel
#                                                           (carries all three)
#   ragfs_python-<ver>-cp314-cp314-android_24_arm64_v8a.whl standalone binding
#   openviking-native-android-aarch64-<ver>.tar.gz          runtime bundle for
#                                                           source checkouts
#
# Native-only component checks (NOT a complete application installation):
#   pip install openviking-<ver>-cp314-cp314-android_24_arm64_v8a.whl --no-deps
#   # or, for a source checkout:
#   python scripts/build_support/android_native.py install \
#       openviking-native-android-aarch64-<version>.tar.gz --root . --force
# Both extensions explicitly link Termux's libpython, and the NDK's
# -Wl,--no-undefined enforces resolution, so the device must run the same CPython
# minor version. Use a matching existing interpreter or a private extracted
# runtime; do not upgrade the device's system Python just to run a smoke test.
#
# Only hosted runners are used (see tests/misc/test_linux_runner.py): the NDK
# cross-compiles aarch64 from x86_64, so no self-hosted pool is involved.

on:
  workflow_dispatch:
    inputs:
      android_api_level:
        description: 'Minimum Android API level (Termux baseline)'
        required: false
        default: '24'
      termux_repo:
        description: 'Termux apt repository providing bionic CPython headers'
        required: false
        default: 'https://packages.termux.dev/apt/termux-main'
      termux_python_version:
        description: 'CPython minor (empty uses pinned profile; only 3.14 is supported)'
        required: false
        default: ''
      version:
        description: 'Override the version stamped into ov (default: resolve from git)'
        required: false
        default: ''
  workflow_call:
    inputs:
      android_api_level:
        type: string
        required: false
        default: '24'
      termux_repo:
        type: string
        required: false
        default: 'https://packages.termux.dev/apt/termux-main'
      termux_python_version:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'android-native-v*'

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: Cross-build aarch64 (NDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_API_LEVEL: ${{ inputs.android_api_level || '24' }}
      TERMUX_REPO: ${{ inputs.termux_repo || 'https://packages.termux.dev/apt/termux-main' }}
      # A different minor requires a separately reviewed target profile.
      REQUESTED_TERMUX_PY_VERSION: ${{ inputs.termux_python_version || '' }}
      # Extensions must be bionic, so they are NDK cross builds.
      PY_TARGET: aarch64-linux-android
      # The CLI is shipped as a fully static musl binary: `machine-uid`
      # (a CLI dependency) has no android implementation, and a static
      # musl binary runs in Termux anyway - this matches the official
      # `@openviking/cli-linux-arm64` artifact.
      CLI_TARGET: aarch64-unknown-linux-musl
      # ccache is picked up by Cargo (cc-rs) and by the CMake build below.
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools_scm derives the version from tags.
          fetch-depth: 0

      - name: Test Android packaging helpers
        run: python3 -m unittest discover -s tests/misc -p test_android_native.py -v

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Load pinned Android target profile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.build_support.android_target env --out "$RUNNER_TEMP/android-target.env"
          source "$RUNNER_TEMP/android-target.env"
          if [[ -n "$REQUESTED_TERMUX_PY_VERSION" && "$REQUESTED_TERMUX_PY_VERSION" != "$TERMUX_PY_VERSION_PIN" ]]; then
            echo "::error::termux_python_version must be $TERMUX_PY_VERSION_PIN; another minor requires a reviewed Android target profile"
            exit 1
          fi
          if [[ ! "$ANDROID_API_LEVEL" =~ ^[0-9]+$ ]] || (( ANDROID_API_LEVEL < 24 )); then
            echo '::error::android_api_level must be an integer >= 24'
            exit 1
          fi
          cat "$RUNNER_TEMP/android-target.env" >> "$GITHUB_ENV"

      # The NDK cross build needs CPython artifacts that were compiled *for
      # bionic*: pyconfig.h carries the Android-specific ABI settings, and
      # find_package(Python3 COMPONENTS Development) also wants a libpython.
      # Termux ships both in its single `python` deb, so we extract that instead
      # of depending on a Termux container image.
      - name: Resolve Termux CPython sysroot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_support/termux_sysroot.py \
            --dest "$RUNNER_TEMP/termux-sysroot" \
            --repo "$TERMUX_REPO" \
            --python-version "$TERMUX_PY_VERSION_PIN" \
            --expected-sha256 "$TERMUX_PYTHON_DEB_SHA256" \
            --write-env "$RUNNER_TEMP/termux-sysroot.env"
          cat "$RUNNER_TEMP/termux-sysroot.env" >> "$GITHUB_ENV"

      # CMake's FindPython3 rejects an interpreter whose minor version differs
      # from the headers/libpython it was given, so the host interpreter must
      # match the Termux one (currently 3.14). It is only used for
      # `find_package(Python3 COMPONENTS Interpreter ...)`; nothing is executed
      # against the target tree.
      - name: Install a host CPython matching the Termux version
        shell: bash
        run: |
          set -euo pipefail
          uv python install "$ANDROID_BUILD_PYTHON"
          host_py="$(uv python find "$ANDROID_BUILD_PYTHON")"
          "$host_py" -V
          echo "HOST_PY=$host_py" >> "$GITHUB_ENV"

      - name: Install the pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK missing}}"
          ndk="$sdk/ndk/$ANDROID_NDK_REVISION"
          if [[ ! -d "$ndk" ]]; then
            sdkmanager --install "ndk;$ANDROID_NDK_REVISION"
          fi
          revision="$(awk -F'= ' '/^Pkg.Revision/ {print $2}' "$ndk/source.properties")"
          if [[ "$revision" != "$ANDROID_NDK_REVISION" ]]; then
            echo "::error::expected NDK $ANDROID_NDK_REVISION, found $revision"
            exit 1
          fi
          ndk_bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$ndk_bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          if [[ ! -x "$cc" ]]; then
            echo "::error::missing NDK compiler $cc"
            exit 1
          fi
          {
            echo "NDK_ROOT=$ndk"
            echo "NDK_BIN=$ndk_bin"
            echo "ANDROID_NDK_VERSION=$revision"
            echo "NDK_VERSION=$revision"
          } >> "$GITHUB_ENV"

      # cc-rs/build-scripts pick the NDK up through the per-target CC/CXX/AR
      # variables; the linker variable is what `cargo build --target` uses.
      - name: Configure cargo for aarch64-linux-android
        shell: bash
        run: |
          set -euo pipefail
          cc="$NDK_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          # No CFLAGS/CXXFLAGS: the NDK's <triple><api>-clang wrapper already
          # defines __ANDROID_API__, and passing it again makes crates that
          # compile with -Werror (aws-lc-sys) fail on -Wmacro-redefined.
          {
            echo "CC_aarch64_linux_android=$cc"
            echo "CXX_aarch64_linux_android=${cc}++"
            echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$NDK_BIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
            # Target-specific only: do not leak libpython into the static musl CLI.
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-L$TERMUX_PREFIX/lib -Clink-arg=-Wl,--no-as-needed -Clink-arg=-lpython$TERMUX_PY_VERSION -Clink-arg=-Wl,--no-undefined"
          } >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.ANDROID_RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,aarch64-unknown-linux-musl

      - uses: ./.github/actions/compiler-cache
        with:
          target: aarch64-linux-android

      - name: Resolve the OpenViking version
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            version="$VERSION_OVERRIDE"
          else
            # `uv run --no-project`: the repo's own dependency set cannot resolve
            # here (tree-sitter-php publishes platform wheels only) and we only
            # need setuptools_scm to reproduce setup.py's version scheme.
            version="$(uv run --no-project --with 'setuptools-scm==9.2.2' python -c \
              'import sys; sys.path.insert(0, "."); from scripts.build_support.versioning import resolve_openviking_version; print(resolve_openviking_version())')"
          fi
          echo "OPENVIKING_VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved OpenViking version: $version"

      # A static musl binary: `machine-uid` has no android implementation, so
      # `aarch64-linux-android` cannot build this crate, and Termux runs static
      # musl binaries natively (that is what `@openviking/cli-linux-arm64`
      # ships). Zig supplies the musl C cross compiler that cc-rs needs for ring
      # and the vendored C dependencies, exactly as rust-cli.yml does it.
      - name: Build ov CLI (static musl)
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.13.0
          ZIG_SHA256=d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
          CARGO_ZIGBUILD_VERSION=0.24.1
          zig_dir="$RUNNER_TEMP/zig-$ZIG_VERSION"
          if [[ ! -x "$zig_dir/zig" ]]; then
            mkdir -p "$zig_dir"
            archive="$RUNNER_TEMP/zig-$ZIG_VERSION.tar.xz"
            curl -fsSL --retry 3 "https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz" -o "$archive"
            echo "$ZIG_SHA256  $archive" | sha256sum -c -
            tar -xJf "$archive" --strip-components=1 -C "$zig_dir"
          fi
          # $GITHUB_PATH only affects later steps, so extend PATH here as well.
          export PATH="$zig_dir:$PATH"
          test "$(zig version)" = "$ZIG_VERSION"
          installed="$(cargo zigbuild --version 2>/dev/null || true)"
          if [[ "$installed" != "cargo-zigbuild $CARGO_ZIGBUILD_VERSION" ]]; then
            cargo install --locked --force --version "$CARGO_ZIGBUILD_VERSION" cargo-zigbuild
          fi
          {
            echo "CLI_ZIG_VERSION=$(zig version)"
            echo "CLI_ZIG_ARCHIVE_SHA256=$ZIG_SHA256"
            echo "CLI_CARGO_ZIGBUILD_VERSION=$(cargo zigbuild --version)"
          } >> "$GITHUB_ENV"
          cargo zigbuild --release --locked --target "$CLI_TARGET" -p ov_cli

      - name: Stage ov CLI
        run: |
          set -euo pipefail
          mkdir -p openviking/bin
          cp "target/$CLI_TARGET/release/ov" openviking/bin/ov
          chmod +x openviking/bin/ov

      # Android needs an explicit libpython DT_NEEDED entry for each extension.
      # PYO3_CROSS_LIB_DIR supplies the target configuration; the target-specific
      # RUSTFLAGS above force libpython linkage even for extension-module mode.
      # These same flags also apply to maturin's standalone wheel build below.
      - name: Build ragfs-python (PyO3 abi3)
        shell: bash
        run: |
          set -euo pipefail
          export PYO3_CROSS=1
          export PYO3_CROSS_PYTHON_VERSION="$TERMUX_PY_VERSION"
          export PYO3_CROSS_LIB_DIR="$TERMUX_PREFIX/lib"
          cargo build --release --locked --target "$PY_TARGET" -p ragfs-python
          mkdir -p openviking/lib
          rm -f openviking/lib/ragfs_python*.so
          cp "target/$PY_TARGET/release/libragfs_python.so" \
             openviking/lib/ragfs_python.abi3.so
          chmod +x openviking/lib/ragfs_python.abi3.so

      # Mirrors setup.py's cmake invocation, but driven directly so the Rust
      # stages above are not rebuilt. `ANDROID_STL=c++_static` keeps the module
      # free of a libc++_shared.so dependency (Termux ships it, but a wheel that
      # does not need it is one less way to fail).
      #
      # The module links the Termux libpython explicitly (--no-as-needed keeps the
      # DT_NEEDED entry): the NDK's clang wrapper passes -Wl,--no-undefined and
      # Android resolves the stable-ABI Py* symbols only through that entry.
      - name: Build the C++ vectordb engine (abi3)
        shell: bash
        run: |
          set -euo pipefail
          engine_dir="$GITHUB_WORKSPACE/openviking/storage/vectordb/engine"
          mkdir -p "$engine_dir"
          rm -f "$engine_dir"/*.so
          cmake -S src -B build/android-aarch64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-$ANDROID_API_LEVEL" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MODULE_LINKER_FLAGS="-L$TERMUX_PREFIX/lib -Wl,--no-as-needed -lpython$TERMUX_PY_VERSION" \
            -DOV_PY_OUTPUT_DIR="$engine_dir" \
            -DOV_PY_EXT_SUFFIX=.abi3.so \
            -DPython3_FIND_STRATEGY=LOCATION \
            -DPython3_FIND_IMPLEMENTATIONS=CPython \
            -DPython3_EXECUTABLE="$HOST_PY" \
            -DPython3_INCLUDE_DIR="$TERMUX_PY_INCLUDE_DIR" \
            -DPython3_INCLUDE_DIRS="$TERMUX_PY_INCLUDE_DIR" \
            -DPython3_LIBRARY="$TERMUX_PY_LIBRARY"
          cmake --build build/android-aarch64 --config Release -j"$(nproc)"

      # Fails when an artifact is missing, is not AArch64, was linked against
      # glibc/the wrong libpython, or does not export its PyInit_ symbol.
      - name: Verify the native artifacts
        run: |
          python3 scripts/build_support/android_native.py verify --root . \
            --readelf "$NDK_BIN/llvm-readelf" --python-version "$TERMUX_PY_VERSION"

      # Studio is optional: the server works without the /studio bundle, so a
      # Vite failure must not block the native artifacts.
      - name: Build the Studio bundle (best effort)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd web-studio
          npm ci --no-audit --no-fund
          npm run build -- --base=/studio/
          rm -rf ../openviking/web_studio/dist
          cp -r dist ../openviking/web_studio/dist

      # No PEP 517 isolation: `[build-system].requires` pins cmake + the
      # tree-sitter grammars, which do not resolve on a runner either.
      - name: Install wheel-build tools
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python "$HOST_PY" "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" \
            'setuptools==84.2.1' 'setuptools-scm==9.2.2' 'wheel==0.48.0' 'maturin==1.16.0' 'packaging==26.3'

      - name: Build ragfs-python wheel
        shell: bash
        run: |
          set -euo pipefail
          export PYO3_CROSS=1
          export PYO3_CROSS_PYTHON_VERSION="$TERMUX_PY_VERSION"
          export PYO3_CROSS_LIB_DIR="$TERMUX_PREFIX/lib"
          mkdir -p dist-android
          cd crates/ragfs-python
          "$RUNNER_TEMP/wheel-venv/bin/maturin" build --release --locked \
            --target "$PY_TARGET" --out "$GITHUB_WORKSPACE/dist-android"

      # Reuses the cross-built artifacts: every native stage of setup.py is
      # skipped, and package_data ships bin/ov, lib/ragfs_python*.so and
      # storage/vectordb/engine/*.abi3.so inside the wheel.
      - name: Build openviking wheel
        shell: bash
        env:
          OV_SKIP_CPP_BUILD: '1'
          OV_SKIP_OV_BUILD: '1'
          OV_SKIP_RAGFS_BUILD: '1'
          OV_REQUIRE_RAGFS_BUILD: '0'
        run: |
          set -euo pipefail
          export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_OPENVIKING="$OPENVIKING_VERSION"
          "$RUNNER_TEMP/wheel-venv/bin/python" setup.py bdist_wheel \
            --plat-name "android_${ANDROID_API_LEVEL}_arm64_v8a" --dist-dir dist-android

      # Both producers use abi3 internally, but the real NDK extensions link
      # versioned libpython. wheel tags rewrites filename, WHEEL and RECORD;
      # this is not a manylinux relabel (the ELF checker below rejects glibc).
      - name: Stamp honest exact-minor Android wheel tags
        shell: bash
        run: |
          set -euo pipefail
          tag="cp${TERMUX_PY_VERSION//./}"
          for whl in dist-android/*.whl; do
            "$RUNNER_TEMP/wheel-venv/bin/python" -m wheel tags \
              --python-tag "$tag" --abi-tag "$tag" \
              --platform-tag "android_${ANDROID_API_LEVEL}_arm64_v8a" --remove "$whl"
          done

      - name: Inspect the wheels
        run: |
          set -euo pipefail
          python3 scripts/build_support/android_native.py wheel-check --dist dist-android \
            --python-version "$TERMUX_PY_VERSION" --android-api "$ANDROID_API_LEVEL" \
            --readelf "$NDK_BIN/llvm-readelf"
          for whl in dist-android/*.whl; do
            echo "== $whl"
            python3 -c "import sys, zipfile; print('\n'.join(sorted(zipfile.ZipFile(sys.argv[1]).namelist())))" "$whl"
          done

      - name: Package the runtime bundle
        run: |
          python3 scripts/build_support/android_native.py bundle \
            --root . \
            --out dist-android \
            --version "$OPENVIKING_VERSION" \
            --android-api "$ANDROID_API_LEVEL" \
            --ndk "$ANDROID_NDK_VERSION" \
            --termux-python "$TERMUX_PY_VERSION" --readelf "$NDK_BIN/llvm-readelf"

      # Exercises the restore path the device will run, so a broken manifest or
      # checksum fails here instead of in Termux.
      - name: Round-trip the bundle
        run: |
          set -euo pipefail
          python3 scripts/build_support/android_native.py install \
            dist-android/openviking-native-android-aarch64-*.tar.gz \
            --root "$RUNNER_TEMP/restored" --ignore-arch
          diff <(cd "$RUNNER_TEMP/restored" && find openviking -type f | sort) \
               <(cd . && python3 -c "import sys; sys.path.insert(0, 'scripts/build_support'); import android_native; print('\n'.join(sorted(android_native.ARTIFACTS)))")

      - name: Record toolchain and artifact checksums
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wheel-venv/bin/python" -m scripts.build_support.android_target record \
            --prefix "$TERMUX_PREFIX" \
            --compiler "$NDK_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" \
            --out dist-android/toolchain.json
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import importlib.metadata, json, os
          from pathlib import Path
          path = Path('dist-android/toolchain.json')
          data = json.loads(path.read_text())
          data['build_tools']['setuptools-scm'] = importlib.metadata.version('setuptools-scm')
          data['cli'] = {key: os.environ[key] for key in (
              'CLI_TARGET', 'CLI_ZIG_VERSION', 'CLI_ZIG_ARCHIVE_SHA256', 'CLI_CARGO_ZIGBUILD_VERSION')}
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          cp scripts/build_support/android_target.json dist-android/target-profile.json
          (cd dist-android && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Summarize
        shell: bash
        run: |
          {
            echo "### Android native prebuild (aarch64 / bionic)"
            echo
            echo "- NDK: \`$ANDROID_NDK_VERSION\`, API level $ANDROID_API_LEVEL"
            echo "- Termux CPython: \`$TERMUX_PACKAGE\`"
            echo "- Bundle: \`$(basename dist-android/*.tar.gz)\`"
            echo
            echo '```'
            sha256sum dist-android/*.whl dist-android/*.tar.gz
            echo '```'
            echo
            echo "Native component smoke only (not application acceptance): \`pip install dist-android/openviking-*.whl --no-deps\`"
            echo "(or \`python scripts/build_support/android_native.py install <bundle> --root . --force\`)."
            echo "The artifacts require Termux CPython $TERMUX_PY_VERSION; use a matching interpreter/private runtime without changing system Python. Full installation requires the complete dependency wheelhouse."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: openviking-native-android-aarch64
          path: |
            dist-android/*.whl
            dist-android/*.tar.gz
            dist-android/*.sha256
            dist-android/*.json
            dist-android/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: ov-android-aarch64
          path: openviking/bin/ov
          if-no-files-found: error
          retention-days: 30

  attach-release:
    name: Attach bundle to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-native-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: openviking-native-android-aarch64
          path: dist-android

      # Only uploads to a release that already exists; creating one here would
      # re-enter release.yml and publish an android-only tag through the regular
      # wheel/publish pipeline.
      - name: Upload assets to an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-android/* --clobber
          else
            echo "::warning::release $TAG does not exist; assets stay on this run"
          fi
